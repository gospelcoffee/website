<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-KDFXDFD974"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-KDFXDFD974');
  </script>
  <script>
    /* Catch-all: GitHub Pages serves this file for any unmatched path.
       Send every URL to the homepage. If the path looks like a known
       section, append the matching anchor so the homepage snaps to it
       (same targets the legacy .html stubs use). Runs before render so
       there is no 404 flash for JS visitors. */
    (function () {
      var seg = location.pathname
        .replace(/^\/+|\/+$/g, "")
        .split("/")[0]
        .replace(/\.html$/i, "")
        .toLowerCase();
      var map = {
        locations: "#today", location: "#today", visit: "#today", today: "#today",
        menu: "?menu=full#menu",
        philosophy: "#philosophy", approach: "#philosophy"
      };
      var suffix = Object.prototype.hasOwnProperty.call(map, seg) ? map[seg] : "";
      location.replace(location.origin + "/" + suffix);
    })();
  </script>
  <title>Not Found | Valo Coffee</title>
  <meta name="description" content="The page you were looking for is not here." />
  <meta name="robots" content="noindex, follow" />
  <link rel="icon" type="image/png" href="/assets/images/sun-icon-black-clear.png" />
  <link rel="apple-touch-icon" href="/assets/images/sun-icon-black-clear.png" />
  <link rel="stylesheet" href="/assets/css/styles.css" />
  <meta name="theme-color" content="#ffffff" />
</head>
<body>
  <header class="site-header">
    <div class="container site-header-inner">
      <a class="brand" href="/">
        <img class="brand-mark" src="/assets/images/valo-coffee-horizontal-black-and-clear.svg" alt="Valo Coffee" />
      </a>
    </div>
  </header>

  <main id="main">
    <section class="section">
      <div class="container-narrow stack-md">
        <span class="eyebrow">404</span>
        <h1 class="headline-lg">This page is not on the menu.</h1>
        <p class="lede">The page you were looking for is not here. The coffee, however, is.</p>
        <div class="button-row">
          <a class="button" href="/">Go home</a>
          <a class="button button-secondary" href="/?menu=full#menu">View menu</a>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <div class="footer-bottom">
        <span>&copy; Valo Coffee</span>
        <span>Prescott, Arizona</span>
      </div>
    </div>
  </footer>

</body>
</html>
